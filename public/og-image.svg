<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0c162d" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#060910" />
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.85)" />
      <stop offset="100%" stop-color="rgba(11, 17, 32, 0.95)" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(34, 211, 238, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="rgba(34, 211, 238, 0.12)" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="rgba(37, 99, 235, 0.10)" filter="url(#glow)" />

  <!-- Outer Glass Frame Container -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="url(#cardGrad)" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1.5" />

  <!-- Top Decorative Header Bar -->
  <rect x="80" y="70" width="1040" height="48" rx="24" fill="rgba(14, 22, 41, 0.9)" />
  <circle cx="120" cy="94" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="140" cy="94" r="6" fill="#eab308" opacity="0.8" />
  <circle cx="160" cy="94" r="6" fill="#10b981" opacity="0.8" />
  <text x="190" y="99" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">samuel.midaz.dev — system_architecture.env</text>

  <!-- Logo Mark -->
  <g transform="translate(130, 160)">
    <rect width="72" height="72" rx="18" fill="url(#cyanGrad)" />
    <rect x="2" y="2" width="68" height="68" rx="16" fill="#090d16" />
    <text x="36" y="47" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="900" text-anchor="middle">M</text>
  </g>

  <!-- Brand Title & Honorific -->
  <text x="224" y="195" fill="#ffffff" font-family="'Inter', sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    Dato' Samuel F. <tspan fill="#64748b" font-weight="400">|</tspan> <tspan fill="#38bdf8">Midaz Dev</tspan>
  </text>
  <text x="224" y="224" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" letter-spacing="1">
    FOUNDER • PRINCIPAL AI SYSTEMS ARCHITECT
  </text>

  <!-- Hero Tagline -->
  <text x="130" y="315" fill="#ffffff" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
    Architecting <tspan fill="url(#cyanGrad)">AI Governance</tspan> &amp;
  </text>
  <text x="130" y="370" fill="#ffffff" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
    High-Performance Web Systems
  </text>

  <!-- Bottom Capability Badges -->
  <!-- Badge 1: AI Governance -->
  <g transform="translate(130, 430)">
    <rect width="180" height="42" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <circle cx="20" cy="21" r="4" fill="#34d399" />
    <text x="34" y="26" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">AI Governance</text>
  </g>

  <!-- Badge 2: Next.js 15 & Astro -->
  <g transform="translate(325, 430)">
    <rect width="210" height="42" rx="10" fill="rgba(34, 211, 238, 0.12)" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1" />
    <circle cx="20" cy="21" r="4" fill="#22d3ee" />
    <text x="34" y="26" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Next.js 15 • Astro</text>
  </g>

  <!-- Badge 3: Python FastAPI -->
  <g transform="translate(550, 430)">
    <rect width="190" height="42" rx="10" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <circle cx="20" cy="21" r="4" fill="#60a5fa" />
    <text x="34" y="26" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Python FastAPI</text>
  </g>

  <!-- Badge 4: Clean Architecture -->
  <g transform="translate(755, 430)">
    <rect width="220" height="42" rx="10" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
    <circle cx="20" cy="21" r="4" fill="#fbbf24" />
    <text x="34" y="26" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Clean Architecture</text>
  </g>

  <!-- Right Side Accent: Interactive CLI Indicator -->
  <g transform="translate(130, 500)">
    <text x="0" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13">
      ⚡ Live Portal: <tspan fill="#38bdf8" font-weight="700">https://samuel.midaz.dev</tspan> | GitHub: <tspan fill="#cbd5e1">github.com/midazdev</tspan>
    </text>
  </g>
</svg>
